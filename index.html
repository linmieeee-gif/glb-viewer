<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLB 模型查看器</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #222; }
    #container { width: 100vw; height: 100vh; }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 18px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="loading">加载中...</div>

  <script src="https://unpkg.com/three@0.152.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.152.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.152.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    let scene, camera, renderer, controls;
    
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x222222);

      camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 2, 5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.getElementById('container').appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(5, 5, 5);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function loadModel(modelUrl, textureUrl) {
      const loader = new THREE.GLTFLoader();
      
      loader.load(
        modelUrl,
        function (gltf) {
          const model = gltf.scene;
          
          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          const scale = 3 / maxDim;
          model.scale.setScalar(scale);
          model.position.x += (model.position.x - center.x) * scale;
          model.position.y += (model.position.y - center.y) * scale;
          model.position.z += (model.position.z - center.z) * scale;

          if (textureUrl) {
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load(
              textureUrl,
              function (texture) {
                model.traverse(function (child) {
                  if (child.isMesh) {
                    if (child.material && child.material.color) {
                      const c = child.material.color;
                      if (c.r > 0.8 && c.g < 0.3 && c.b < 0.3) {
                        child.material.map = texture;
                        child.material.color.setHex(0xffffff);
                        child.material.needsUpdate = true;
                      }
                    }
                  }
                });
                document.getElementById('loading').style.display = 'none';
              }
            );
          } else {
            document.getElementById('loading').style.display = 'none';
          }

          scene.add(model);
        }
      );
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    init();

    const params = new URLSearchParams(window.location.search);
    loadModel(params.get('model') || '', params.get('texture') || '');
  </script>
</body>
</html>
