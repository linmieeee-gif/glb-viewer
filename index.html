<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLB 模型查看器</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #222; font-family: Arial, sans-serif; }
    #container { width: 100vw; height: 100vh; }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 18px;
      z-index: 100;
      text-align: center;
    }
    #upload-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 10px;
      color: white;
      z-index: 100;
      max-width: 300px;
    }
    #upload-panel h3 {
      margin-bottom: 10px;
    }
    #upload-panel input {
      margin: 10px 0;
      width: 100%;
    }
    #upload-panel button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
    }
    #upload-panel button:hover {
      background: #45a049;
    }
    #info {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 10px;
      color: white;
      z-index: 100;
      font-size: 12px;
    }
    #error {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 0, 0, 0.9);
      color: white;
      padding: 20px;
      border-radius: 10px;
      z-index: 200;
      display: none;
      max-width: 80%;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  
  <div id="loading">
    <div>加载中...</div>
    <div style="margin-top: 10px; font-size: 14px; color: #aaa;">请在小程序中使用，或使用下方按钮上传文件</div>
  </div>
  
  <div id="upload-panel">
    <h3>📁 测试模式</h3>
    <p style="font-size: 12px; color: #aaa; margin-bottom: 10px;">直接在网页中测试：</p>
    <label>1. 选择 GLB 模型：</label>
    <input type="file" id="model-input" accept=".glb,.gltf">
    <label>2. 选择图片（可选）：</label>
    <input type="file" id="texture-input" accept="image/*">
    <button id="load-btn">加载模型</button>
  </div>
  
  <div id="info">
    <div>🖱️ 拖动旋转 | 🔍 双指缩放</div>
  </div>
  
  <div id="error"></div>

  <script src="https://unpkg.com/three@0.152.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.152.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.152.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    let scene, camera, renderer, controls;
    let currentModel = null;
    
    function init() {
      try {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        camera.position.set(0, 2, 5);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('container').appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // 添加网格地面
        const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x333333);
        scene.add(gridHelper);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        window.addEventListener('resize', onWindowResize);
        animate();
        
        console.log('Three.js 初始化成功');
        
        // 检查 URL 参数
        const params = new URLSearchParams(window.location.search);
        const modelUrl = params.get('model');
        const textureUrl = params.get('texture');
        
        if (modelUrl) {
          console.log('从 URL 加载模型:', modelUrl);
          loadModelFromUrl(modelUrl, textureUrl);
        } else {
          console.log('没有模型参数，显示上传面板');
          document.getElementById('loading').innerHTML = 
            '<div style="font-size: 24px;">🎨 GLB 模型查看器</div>' +
            '<div style="margin-top: 10px; font-size: 14px; color: #aaa;">使用下方按钮上传模型和图片</div>';
        }
      } catch (e) {
        console.error('初始化失败:', e);
        showError('初始化失败: ' + e.message);
      }
    }

    function loadModelFromUrl(modelUrl, textureUrl) {
      const loader = new THREE.GLTFLoader();
      
      loader.load(
        modelUrl,
        function (gltf) {
          console.log('模型加载成功');
          setupModel(gltf.scene, textureUrl);
        },
        function (progress) {
          console.log('加载进度:', (progress.loaded / progress.total * 100).toFixed(0) + '%');
        },
        function (error) {
          console.error('模型加载失败:', error);
          showError('模型加载失败: ' + error.message);
        }
      );
    }

    function loadModelFromFile(modelFile, textureFile) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const contents = e.target.result;
        const loader = new THREE.GLTFLoader();
        
        loader.parse(contents, '', function(gltf) {
          console.log('模型解析成功');
          
          if (textureFile) {
            const textureReader = new FileReader();
            textureReader.onload = function(te) {
              setupModel(gltf.scene, te.target.result);
            };
            textureReader.readAsDataURL(textureFile);
          } else {
            setupModel(gltf.scene, null);
          }
        }, function(error) {
          console.error('模型解析失败:', error);
          showError('模型解析失败: ' + error.message);
        });
      };
      reader.readAsArrayBuffer(modelFile);
    }

    function setupModel(model, textureUrl) {
      // 清除之前的模型
      if (currentModel) {
        scene.remove(currentModel);
      }
      currentModel = model;
      
      // 缩放和居中模型
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 3 / maxDim;
      model.scale.setScalar(scale);
      model.position.x += (model.position.x - center.x) * scale;
      model.position.y += (model.position.y - center.y) * scale;
      model.position.z += (model.position.z - center.z) * scale;

      console.log('模型尺寸:', size, '缩放:', scale);

      if (textureUrl) {
        console.log('应用纹理:', textureUrl);
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load(
          textureUrl,
          function (texture) {
            console.log('纹理加载成功');
            let foundRed = false;
            model.traverse(function (child) {
              if (child.isMesh) {
                if (child.material && child.material.color) {
                  const c = child.material.color;
                  console.log('材质颜色:', c.r.toFixed(2), c.g.toFixed(2), c.b.toFixed(2));
                  if (c.r > 0.8 && c.g < 0.3 && c.b < 0.3) {
                    console.log('找到红色面，应用纹理');
                    child.material.map = texture;
                    child.material.color.setHex(0xffffff);
                    child.material.needsUpdate = true;
                    foundRed = true;
                  }
                }
              }
            });
            if (!foundRed) {
              console.log('未找到红色面，将纹理应用到所有材质');
              model.traverse(function (child) {
                if (child.isMesh && child.material) {
                  child.material.map = texture;
                  child.material.needsUpdate = true;
                }
              });
            }
            document.getElementById('loading').style.display = 'none';
          },
          undefined,
          function(error) {
            console.error('纹理加载失败:', error);
            document.getElementById('loading').style.display = 'none';
          }
        );
      } else {
        document.getElementById('loading').style.display = 'none';
      }

      scene.add(model);
      console.log('模型已添加到场景');
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function showError(message) {
      const errorDiv = document.getElementById('error');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      document.getElementById('loading').style.display = 'none';
      console.error(message);
    }

    // 绑定上传按钮
    document.getElementById('load-btn').addEventListener('click', function() {
      const modelInput = document.getElementById('model-input');
      const textureInput = document.getElementById('texture-input');
      
      if (modelInput.files.length === 0) {
        alert('请先选择一个 GLB 模型文件');
        return;
      }
      
      document.getElementById('loading').style.display = 'block';
      document.getElementById('loading').innerHTML = '<div>正在加载...</div>';
      
      loadModelFromFile(
        modelInput.files[0], 
        textureInput.files.length > 0 ? textureInput.files[0] : null
      );
    });

    // 初始化
    init();
  </script>
</body>
</html>
